<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In - Cyber Forensic Tool</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/modern-theme.css') }}">
</head>
<body>
<div class="auth-wrap">
    <div class="auth-card">
        <div class="auth-logo">🔍</div>
        <div class="auth-title">Welcome back</div>
        <div class="auth-subtitle">Sign in to the Forensic Investigation Platform</div>

        <div class="auth-error" id="authError"></div>

        <form id="loginForm">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" autocomplete="username" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" autocomplete="current-password" required>
            </div>
            <button type="submit" class="btn btn-primary auth-submit" id="loginBtn">
                Sign In
            </button>
        </form>

        <div class="auth-footer">
            Don't have an investigator account? <a href="{{ url_for('auth.register_page') }}">Create one</a>
        </div>
        <div class="auth-footer" style="margin-top:8px;">
            <a href="{{ url_for('dashboard') }}">← Back to home</a>
        </div>
    </div>
</div>

<script>
document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('loginBtn');
    const errBox = document.getElementById('authError');
    errBox.classList.remove('show');
    btn.disabled = true;
    btn.innerHTML = '<span class="spin">⏳</span> Signing in...';

    try {
        const res = await fetch('/api/auth/login', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                username: document.getElementById('username').value,
                password: document.getElementById('password').value
            })
        });
        const data = await res.json();

        if (data.status === 'success') {
            window.location.href = '/';
        } else {
            errBox.textContent = data.error || 'Login failed';
            errBox.classList.add('show');
            btn.disabled = false;
            btn.innerHTML = 'Sign In';
        }
    } catch (err) {
        errBox.textContent = 'Could not reach the server. Please try again.';
        errBox.classList.add('show');
        btn.disabled = false;
        btn.innerHTML = 'Sign In';
    }
});
</script>
</body>
</html>
